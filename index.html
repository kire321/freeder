<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14100c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-192x192.png" />
    <link rel="apple-touch-icon" href="./icon-192x192.png" />
    <title>freeder</title>
    <style>
      /* Theme + background BEFORE React mounts (no white flash). Follows system. */
      html, body { margin: 0; padding: 0; min-height: 100%; }
      html.dark, html.dark body { background-color: #14100c; color: #efe9df; }
      html:not(.dark), html:not(.dark) body { background-color: #f7f3ec; color: #241f18; }
    </style>
    <script>
      (function () {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        function setTheme(e) {
          document.documentElement.classList.toggle('dark', e.matches);
        }
        setTheme(mql);
        mql.addEventListener('change', setTheme);
      })();
    </script>
    <script>
      // Service worker registration (thai-rpg lessons):
      // - cache-busted URL + updateViaCache:'none' so the browser actually
      //   re-checks sw.js after every deploy
      // - re-check on every load AND every return from background
      // - the SW bumps CACHE_NAME per deploy and skipWaiting()s on install
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var swUrl = 'sw.js?v=' + new Date().toISOString().slice(0, 10);
          navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' })
            .then(function (registration) {
              console.log('[PWA] SW registered:', registration.scope);
              registration.update();
              document.addEventListener('visibilitychange', function () {
                if (!document.hidden) registration.update().catch(function () {});
              });
            })
            .catch(function (error) {
              console.error('[PWA] SW registration failed:', error);
            });

          // Hand the SW this page's own JS/CSS bundles as soon as it controls
          // the page. Hashed asset names can't be listed in sw.js statically;
          // without this, the shell loads offline but the bundles 503.
          function cacheOwnAssets() {
            var ctl = navigator.serviceWorker.controller;
            if (!ctl) return;
            var urls = Array.prototype.map.call(
              document.querySelectorAll('script[src], link[rel="stylesheet"][href]'),
              function (el) { return new URL(el.src || el.href, location.href).href; }
            );
            if (urls.length) ctl.postMessage({ type: 'CACHE_URLS', urls: urls });
          }
          if (navigator.serviceWorker.controller) cacheOwnAssets();
          navigator.serviceWorker.addEventListener('controllerchange', cacheOwnAssets);
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DThkcbvg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C8ICyonS.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
